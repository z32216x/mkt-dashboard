name: collect-data

on:
  schedule:
    - cron: "*/15 1-5 * * 1-5"    # 台股盤中(台北 09:00–13:45)
    - cron: "*/15 13-21 * * 1-5"  # 美股盤中(台北約 21:00–05:45,冬夏令都覆蓋)
    - cron: "30 6 * * 1-5"        # 台北 14:30,台股收盤後
    - cron: "0 12 * * 1-5"        # 台北 20:00,晚間補抓
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill / quick / all / prices / news / ptt / twse / prune"
        required: false
        default: "quick"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pick mode
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        run: python collect.py --mode "${{ steps.pick.outputs.mode }}"

      - name: Commit and push data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有新資料"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase origin data && git push origin data && exit 0
            echo "push 重試 $i"
            sleep 5
          done
          exit 1
